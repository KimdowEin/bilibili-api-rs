[package]
name = "bilibili-api-rs"
version = "0.3.0"
edition = "2021"

[dependencies]
rand = "0.8.5"
bitflags = { version = "2.8.0", features = ["serde"] }
chrono = { version = "0.4.39", features = ["serde"] }

base64 = "0.22.1"
rsa = "0.9.7"
hmac = "0.12.1"
sha2 = "0.10.8"
hex = "0.4.3"
md5 = "0.7.0"

serde = { version = "1.0.216", features = ["derive"] }
serde_json = "1.0.133"
serde_qs = "0.15.0"
serde_repr = "0.1.19"
serde-aux = "4.5.0"

thiserror = "2.0.8"

webbrowser = { version = "1.0.3", optional = true }

tokio = { version = "1.42.0", optional = true, features = ["full"] }
reqwest = { version = "0.12.9", optional = true, features = [
    "cookies",
    "json",
    "stream",
] }
paste = { version = "1.0.15", optional = true }
futures = { version = "0.3.31", optional = true }
async-trait = { version = "0.1.88", optional = true }


[dependencies.bili_derive]
path = "./bili_derive"


[dev-dependencies]
toml = "0.8.20"
indicatif = "0.17.9"
tempfile = "3.20.0"

[features]
default = []
# default = ["session","manual"]
session = ["reqwest", "tokio", "futures", "async-trait", "paste"]
manual = ["webbrowser"]
